name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: disabled
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ffmpeg libegl1 libgl1-mesa-dri
          python -m pip install uv==0.13.4
      - name: One-command development setup
        run: bash scripts/install.sh
      - name: Add CPU-only tensor and USD test dependencies
        run: |
          uv pip install --python .venv/bin/python torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python usd-core==25.11
          uv pip check --python .venv/bin/python
      - name: Static validation
        run: |
          .venv/bin/python -m compileall -q embodiment interactive adaptive
          bash -n scripts/install.sh
          bash experiments/ruckig/verify_upstream.sh
      - name: C++ and integration suites
        run: |
          ctest --test-dir build-dev --output-on-failure -j2
          ctest --test-dir build-dev/contract --output-on-failure
      - name: Offline Python suite
        env:
          VIPER_ACTION_CONTRACT_LIBRARY: ${{ github.workspace }}/build-dev/contract/libviper_action_contract.so
        run: .venv/bin/python -m unittest discover -s embodiment/tests -v
      - name: Preserve failed CTest diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-test-diagnostics
          path: build-dev/**/Testing/Temporary/*.log
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts=--all .
